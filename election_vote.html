<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학생부회장 선거 투표</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background: #f5f5f5; min-height: 100vh; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 2rem 1rem 4rem; }
  .header { text-align: center; margin-bottom: 2rem; }
  .header h1 { font-size: 22px; font-weight: 600; color: #1a1a1a; margin-bottom: 6px; }
  .header p { font-size: 14px; color: #777; }
  .card { background: #fff; border: 1px solid #e8e8e8; border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; }
  .section-label { font-size: 13px; color: #555; margin-bottom: 12px; font-weight: 600; }
  .grade-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .grade-btn { padding: 11px; border: 1.5px solid #ddd; border-radius: 8px; background: #fff; color: #333; font-size: 14px; cursor: pointer; transition: all 0.15s; font-family: inherit; }
  .grade-btn:hover { background: #f0effe; border-color: #a09be8; }
  .grade-btn.selected { background: #eeedfe; border-color: #7f77dd; color: #3c3489; font-weight: 600; }
  .candidate-card { border: 1.5px solid #e8e8e8; border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 10px; cursor: pointer; display: flex; align-items: center; gap: 14px; transition: all 0.15s; }
  .candidate-card:hover { background: #f8f8ff; }
  .candidate-card.selected { border: 2.5px solid #7f77dd; background: #eeedfe; }
  .num-circle { width: 38px; height: 38px; border-radius: 50%; background: #eeedfe; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; color: #3c3489; flex-shrink: 0; }
  .candidate-card.selected .num-circle { background: #7f77dd; color: #fff; }
  .candidate-name { font-size: 16px; font-weight: 600; color: #1a1a1a; }
  .candidate-sub { font-size: 13px; color: #888; margin-top: 2px; }
  .check-icon { margin-left: auto; font-size: 22px; color: #534ab7; display: none; }
  .candidate-card.selected .check-icon { display: block; }
  .submit-btn { width: 100%; padding: 14px; border-radius: 10px; border: none; background: #534ab7; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.15s; margin-top: 6px; font-family: inherit; }
  .submit-btn:hover { background: #3c3489; }
  .submit-btn:disabled { background: #e0e0e0; color: #aaa; cursor: not-allowed; }
  .notice { font-size: 12px; color: #aaa; text-align: center; margin-top: 10px; line-height: 1.6; }
  .admin-link { text-align: center; margin-top: 2rem; }
  .admin-link button { background: none; border: none; font-size: 13px; color: #aaa; cursor: pointer; text-decoration: underline; font-family: inherit; }
  /* 완료 화면 */
  .done-wrap { text-align: center; padding: 3rem 1rem; }
  .done-icon { font-size: 60px; margin-bottom: 1rem; }
  .done-title { font-size: 20px; font-weight: 600; color: #1a1a1a; margin-bottom: 8px; }
  .done-sub { font-size: 14px; color: #777; line-height: 1.7; }
  /* 모달 */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 200; align-items: center; justify-content: center; }
  .modal-overlay.active { display: flex; }
  .modal-box { background: #fff; border-radius: 14px; padding: 1.75rem; width: 300px; }
  .modal-box h2 { font-size: 17px; font-weight: 600; margin-bottom: 1rem; color: #1a1a1a; }
  .modal-box input { width: 100%; padding: 11px 12px; border: 1.5px solid #ddd; border-radius: 8px; font-size: 15px; margin-bottom: 10px; font-family: inherit; outline: none; }
  .modal-box input:focus { border-color: #7f77dd; }
  .modal-btns { display: flex; gap: 8px; }
  .modal-btns button { flex: 1; padding: 11px; border-radius: 8px; font-size: 14px; cursor: pointer; font-family: inherit; font-weight: 600; }
  .btn-cancel { background: #f5f5f5; border: none; color: #666; }
  .btn-enter { background: #534ab7; border: none; color: #fff; }
  .modal-error { font-size: 13px; color: #c0392b; margin-bottom: 8px; }
  /* 관리자 페이지 */
  #adminPage { display: none; }
  .admin-header { display: flex; align-items: center; gap: 10px; margin-bottom: 1.5rem; }
  .admin-header h1 { font-size: 20px; font-weight: 600; color: #1a1a1a; }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 1rem; }
  .stat-card { background: #f8f8f8; border-radius: 10px; padding: 1rem; text-align: center; }
  .stat-num { font-size: 28px; font-weight: 700; color: #1a1a1a; }
  .stat-num.purple { color: #534ab7; }
  .stat-num.teal { color: #0f6e56; }
  .stat-lbl { font-size: 12px; color: #888; margin-top: 3px; }
  .bar-section { margin-bottom: 14px; }
  .bar-label { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px; color: #333; }
  .bar-track { background: #f0f0f0; border-radius: 99px; height: 12px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 99px; transition: width 0.5s ease; }
  .bar-1 { background: #7f77dd; }
  .bar-2 { background: #1d9e75; }
  .grade-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .grade-table th { text-align: left; padding: 8px 6px; color: #888; font-weight: 600; border-bottom: 1px solid #eee; }
  .grade-table td { padding: 9px 6px; color: #333; border-bottom: 1px solid #f5f5f5; }
  .reset-btn { width: 100%; padding: 12px; border-radius: 10px; border: 1.5px solid #e74c3c; background: none; color: #c0392b; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 1.5rem; font-family: inherit; }
  .reset-btn:hover { background: #fff0f0; }
  .back-btn { display: block; text-align: center; margin-top: 1rem; background: none; border: none; font-size: 13px; color: #aaa; cursor: pointer; text-decoration: underline; font-family: inherit; }
</style>
</head>
<body>

<!-- 투표/완료 페이지 -->
<div id="votePage">
  <div class="wrap">
    <div class="header">
      <h1>🗳 학생부회장 선거</h1>
      <p>2025학년도 전교 학생부회장 선거</p>
    </div>

    <!-- 완료 화면 -->
    <div id="doneBox" class="card done-wrap" style="display:none;">
      <div class="done-icon">✅</div>
      <div class="done-title">투표가 완료되었습니다</div>
      <div class="done-sub">소중한 한 표 감사합니다.<br>이미 투표에 참여하셨습니다.</div>
    </div>

    <!-- 투표 화면 -->
    <div id="voteForm">
      <div class="card">
        <div class="section-label">📌 본인 학년을 선택해주세요</div>
        <div class="grade-grid">
          <button class="grade-btn" onclick="selectGrade(0, this)">1학년</button>
          <button class="grade-btn" onclick="selectGrade(1, this)">2학년</button>
          <button class="grade-btn" onclick="selectGrade(2, this)">3학년</button>
        </div>
      </div>

      <div class="card">
        <div class="section-label">🗳 투표할 후보를 선택해주세요</div>

        <div class="candidate-card" id="card1" onclick="selectCandidate(1)">
          <div class="num-circle">1</div>
          <div>
            <div class="candidate-name">김가현</div>
            <div class="candidate-sub">기호 1번</div>
          </div>
          <span class="check-icon">✔</span>
        </div>

        <div class="candidate-card" id="card2" onclick="selectCandidate(2)">
          <div class="num-circle">2</div>
          <div>
            <div class="candidate-name">박지후</div>
            <div class="candidate-sub">기호 2번</div>
          </div>
          <span class="check-icon">✔</span>
        </div>

        <button class="submit-btn" id="submitBtn" disabled onclick="submitVote()">투표하기</button>
        <p class="notice">투표는 무기명으로 처리되며, 1인 1회만 가능합니다.</p>
      </div>
    </div>

    <div class="admin-link">
      <button onclick="openAdminModal()">관리자 페이지</button>
    </div>
  </div>
</div>

<!-- 관리자 페이지 -->
<div id="adminPage">
  <div class="wrap">
    <div class="admin-header">
      <h1>📊 투표 현황</h1>
    </div>

    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-num" id="totalCount">0</div>
        <div class="stat-lbl">총 투표 수</div>
      </div>
      <div class="stat-card">
        <div class="stat-num purple" id="count1">0</div>
        <div class="stat-lbl">김가현</div>
      </div>
      <div class="stat-card">
        <div class="stat-num teal" id="count2">0</div>
        <div class="stat-lbl">박지후</div>
      </div>
    </div>

    <div class="card">
      <div class="section-label" style="margin-bottom:16px">후보별 득표율</div>
      <div class="bar-section">
        <div class="bar-label">
          <span>기호 1번 김가현</span>
          <span id="pct1">0표 (0%)</span>
        </div>
        <div class="bar-track"><div class="bar-fill bar-1" id="bar1" style="width:0%"></div></div>
      </div>
      <div class="bar-section">
        <div class="bar-label">
          <span>기호 2번 박지후</span>
          <span id="pct2">0표 (0%)</span>
        </div>
        <div class="bar-track"><div class="bar-fill bar-2" id="bar2" style="width:0%"></div></div>
      </div>
    </div>

    <div class="card">
      <div class="section-label" style="margin-bottom:12px">학년별 투표 현황</div>
      <table class="grade-table">
        <thead>
          <tr>
            <th>학년</th>
            <th>김가현</th>
            <th>박지후</th>
            <th>합계</th>
          </tr>
        </thead>
        <tbody id="gradeTableBody"></tbody>
      </table>
    </div>

    <button class="reset-btn" onclick="resetVotes()">🔄 투표 데이터 초기화</button>
    <button class="back-btn" onclick="goBack()">← 투표 페이지로 돌아가기</button>
  </div>
</div>

<!-- 관리자 코드 모달 -->
<div class="modal-overlay" id="adminModal">
  <div class="modal-box">
    <h2>🔒 관리자 인증</h2>
    <div class="modal-error" id="modalError" style="display:none">코드가 올바르지 않습니다.</div>
    <input type="password" id="adminCodeInput" placeholder="관리자 코드 입력"
      onkeydown="if(event.key==='Enter') checkAdminCode()" />
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeAdminModal()">취소</button>
      <button class="btn-enter" onclick="checkAdminCode()">확인</button>
    </div>
  </div>
</div>

<script>
  // ★ 관리자 코드 변경 시 여기를 수정하세요 ★
  const ADMIN_CODE = "sh26elc";

  const STORAGE_KEY = "election_data_v1";
  const VOTED_KEY   = "election_voted_v1";

  let selectedGrade = null;
  let selectedCandidate = null;

  function getVotes() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || { v1: 0, v2: 0, byGrade: [{v1:0,v2:0},{v1:0,v2:0},{v1:0,v2:0}] };
    } catch { return { v1: 0, v2: 0, byGrade: [{v1:0,v2:0},{v1:0,v2:0},{v1:0,v2:0}] }; }
  }
  function saveVotes(d) { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }
  function hasVoted()   { return !!localStorage.getItem(VOTED_KEY); }
  function markVoted()  { localStorage.setItem(VOTED_KEY, "1"); }

  function init() {
    if (hasVoted()) {
      document.getElementById("voteForm").style.display = "none";
      document.getElementById("doneBox").style.display  = "block";
    }
  }

  function selectGrade(idx, btn) {
    selectedGrade = idx;
    document.querySelectorAll(".grade-btn").forEach(b => b.classList.remove("selected"));
    btn.classList.add("selected");
    updateSubmitBtn();
  }

  function selectCandidate(num) {
    selectedCandidate = num;
    document.getElementById("card1").classList.toggle("selected", num === 1);
    document.getElementById("card2").classList.toggle("selected", num === 2);
    updateSubmitBtn();
  }

  function updateSubmitBtn() {
    document.getElementById("submitBtn").disabled = !(selectedGrade !== null && selectedCandidate !== null);
  }

  function submitVote() {
    if (selectedGrade === null || selectedCandidate === null) return;
    const data = getVotes();
    if (selectedCandidate === 1) data.v1++;
    else data.v2++;
    data.byGrade[selectedGrade][selectedCandidate === 1 ? "v1" : "v2"]++;
    saveVotes(data);
    markVoted();
    document.getElementById("voteForm").style.display = "none";
    document.getElementById("doneBox").style.display  = "block";
  }

  function openAdminModal() {
    document.getElementById("adminCodeInput").value = "";
    document.getElementById("modalError").style.display = "none";
    document.getElementById("adminModal").classList.add("active");
    setTimeout(() => document.getElementById("adminCodeInput").focus(), 100);
  }
  function closeAdminModal() {
    document.getElementById("adminModal").classList.remove("active");
  }
  function checkAdminCode() {
    const input = document.getElementById("adminCodeInput").value;
    if (input === ADMIN_CODE) {
      closeAdminModal();
      showAdminPage();
    } else {
      document.getElementById("modalError").style.display = "block";
    }
  }

  document.getElementById("adminModal").addEventListener("click", function(e) {
    if (e.target === this) closeAdminModal();
  });

  function showAdminPage() {
    const data  = getVotes();
    const total = data.v1 + data.v2;
    const pct   = n => total === 0 ? 0 : Math.round(n / total * 100);

    document.getElementById("totalCount").textContent = total;
    document.getElementById("count1").textContent     = data.v1;
    document.getElementById("count2").textContent     = data.v2;
    document.getElementById("pct1").textContent       = data.v1 + "표 (" + pct(data.v1) + "%)";
    document.getElementById("pct2").textContent       = data.v2 + "표 (" + pct(data.v2) + "%)";
    document.getElementById("bar1").style.width       = pct(data.v1) + "%";
    document.getElementById("bar2").style.width       = pct(data.v2) + "%";

    const grades = ["1학년", "2학년", "3학년"];
    let tbody = "";
    grades.forEach((g, i) => {
      const gd = data.byGrade[i] || {v1:0, v2:0};
      tbody += "<tr><td>" + g + "</td><td>" + gd.v1 + "표</td><td>" + gd.v2 + "표</td><td>" + (gd.v1 + gd.v2) + "표</td></tr>";
    });
    document.getElementById("gradeTableBody").innerHTML = tbody;

    document.getElementById("votePage").style.display  = "none";
    document.getElementById("adminPage").style.display = "block";
  }

  function resetVotes() {
    if (confirm("투표 데이터를 초기화할까요?\n이 작업은 되돌릴 수 없습니다.")) {
      localStorage.removeItem(STORAGE_KEY);
      showAdminPage();
    }
  }

  function goBack() {
    document.getElementById("adminPage").style.display = "none";
    document.getElementById("votePage").style.display  = "block";
  }

  init();
</script>
</body>
</html>
